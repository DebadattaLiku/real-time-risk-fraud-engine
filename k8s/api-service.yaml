apiVersion: v1
kind: Service
metadata:
  name: fraud-risk-api
  namespace: fraud-risk-engine
spec:
  selector:
    app: fraud-risk-api
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP   # front with an Ingress or a cloud LoadBalancer for external access — neither is included here (see README's AWS Load Balancer mapping)
