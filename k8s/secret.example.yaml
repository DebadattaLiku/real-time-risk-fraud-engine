# EXAMPLE ONLY — never commit a real filled-in Secret to source control.
# Copy this to secret.yaml, fill in real values, and apply that file
# instead (secret.yaml should be in .gitignore, matching the .env
# convention already established in this repository).
apiVersion: v1
kind: Secret
metadata:
  name: fraud-risk-api-secrets
  namespace: fraud-risk-engine
type: Opaque
stringData:
  REDIS_URL: "redis://:CHANGE_ME_PASSWORD@redis:6379/0"
  # KAFKA_SASL_USERNAME / KAFKA_SASL_PASSWORD would go here for a real
  # authenticated broker (e.g. Amazon MSK with SASL/SCRAM) — not needed
  # for the unauthenticated local dev docker-compose.kafka.yml topology.
