# Local development Kafka + Redis, for use on a machine with normal
# Docker Hub access (this sandboxed development environment does NOT have
# that access — see reports/production_architecture_audit.md — so this
# file was authored and YAML-validated here, but NEVER actually run here).
#
# Usage elsewhere:
#   docker compose -f docker-compose.kafka.yml up -d
#   KAFKA_BROKERS=localhost:9092 REDIS_URL=redis://localhost:6379/0 \
#     uvicorn src.api.main:app --reload
#
# Uses apache/kafka's single-node KRaft-mode image (no separate Zookeeper
# process needed) — the standard, current way to run Kafka locally.
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
