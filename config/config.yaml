# Phase 0 configuration.
# Split ratios are the PROPOSED targets to validate against actual data in
# Phase 0 EDA. They are not final until confirmed against the real
# TransactionDT distribution and fraud-rate-over-time behavior.

paths:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  reports_dir: "reports"
  figures_dir: "reports/figures"

  train_transaction: "data/raw/train_transaction.csv"
  train_identity: "data/raw/train_identity.csv"
  test_transaction: "data/raw/test_transaction.csv"
  test_identity: "data/raw/test_identity.csv"

split:
  method: "time_based"     # never random
  time_column: "TransactionDT"
  target_column: "isFraud"
  id_column: "TransactionID"
  train_ratio: 0.70
  val_ratio: 0.15
  test_ratio: 0.15

pseudo_entity:
  # Candidate field combinations to evaluate in Phase 0.
  # isFraud must never be used to construct these keys.
  candidates:
    - ["card1"]
    - ["card1", "card2"]
    - ["card1", "card2", "addr1"]
    - ["card1", "card2", "card3", "card5", "addr1", "addr2"]

random_seed: 42
